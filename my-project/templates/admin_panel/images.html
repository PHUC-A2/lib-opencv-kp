{% extends "base/dashboard.html" %}

{% block title %}{{ page_title }} - Admin{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="card bg-white border border-[#E5E7EB] shadow-sm rounded-xl">
        <div class="card-body">
            <form
                id="admin-images-filter"
                method="get"
                hx-get="{% url 'admin_panel:images' %}"
                hx-target="#admin-images-table"
                hx-trigger="change from:select, keyup changed delay:400ms from:input[type='search'], submit"
                hx-push-url="true"
                class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 items-end"
            >
                <div class="form-control xl:col-span-2">
                    <label class="label" for="id_search"><span class="label-text font-medium">{{ filter_form.search.label }}</span></label>
                    <input type="search" name="search" id="id_search" value="{{ search }}" class="input input-bordered w-full rounded-xl" placeholder="Tên file ảnh...">
                </div>
                <div class="form-control">
                    <label class="label" for="id_user_id"><span class="label-text font-medium">{{ filter_form.user_id.label }}</span></label>
                    <select name="user_id" id="id_user_id" class="select select-bordered w-full rounded-xl">
                        <option value="">Tất cả người dùng</option>
                        {% for u in filter_form.fields.user_id.queryset %}
                            <option value="{{ u.pk }}" {% if user_id == u.pk %}selected{% endif %}>{{ u.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-control flex flex-row gap-2 xl:col-span-3">
                    <button type="submit" class="btn btn-primary-gradient btn-sm rounded-xl">🔍 Áp dụng lọc</button>
                    <a href="{% url 'admin_panel:images' %}" class="btn btn-ghost btn-sm rounded-xl">Xóa lọc</a>
                </div>
            </form>
        </div>
    </div>

    <div id="admin-images-table">
        {% include "admin_panel/partials/images_table.html" %}
    </div>
</div>
{% endblock %}
