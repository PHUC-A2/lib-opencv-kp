{% if users %}
<div class="card bg-white border border-[#E5E7EB] shadow-sm rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
        <table class="table table-zebra">
            <thead class="bg-[#F9FAFB]">
                <tr class="text-[#6B7280] text-sm">
                    <th>#</th>
                    <th>Người dùng</th>
                    <th>Email</th>
                    <th>Vai trò</th>
                    <th>Ảnh / Job</th>
                    <th>Trạng thái</th>
                    <th>Ngày tạo</th>
                    <th class="text-right">Hành động</th>
                </tr>
            </thead>
            <tbody>
                {% for user_item in users %}
                    {% include "admin_panel/partials/user_row.html" %}
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% else %}
<div class="card bg-white border border-[#E5E7EB] shadow-sm rounded-xl">
    <div class="card-body items-center text-center py-12">
        <span class="text-5xl">👥</span>
        <p class="font-medium text-lg mt-4">Không tìm thấy người dùng</p>
        <p class="text-[#6B7280] mt-1">Thử thay đổi bộ lọc tìm kiếm</p>
    </div>
</div>
{% endif %}
