<div
    class="form-control w-full"
    x-data="{ showPassword: false }"
    x-init="if (window.refreshLucideIcons) { refreshLucideIcons($el); }"
>
    <label class="label" for="{{ field.id_for_label }}">
        <span class="label-text font-medium">{{ field.label }}</span>
    </label>
    <div class="password-field-wrap">
        <input
            type="password"
            x-bind:type="showPassword ? 'text' : 'password'"
            name="{{ field.html_name }}"
            id="{{ field.id_for_label }}"
            value="{{ field.value|default:'' }}"
            class="input input-bordered w-full pr-12 password-field-input {% if field.errors %}input-error{% endif %}"
            placeholder="{{ field.field.widget.attrs.placeholder|default:'' }}"
            autocomplete="{{ field.field.widget.attrs.autocomplete|default:'off' }}"
            {% if field.field.required %}required{% endif %}
        >
        <button
            type="button"
            class="password-toggle-btn"
            @click="showPassword = !showPassword; $nextTick(() => window.refreshLucideIcons && refreshLucideIcons($el))"
            :aria-label="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            :aria-pressed="showPassword"
        >
            <span class="password-toggle-icon">
                <i
                    data-lucide="eye"
                    class="icon-inline icon-sm"
                    x-show="!showPassword"
                    x-transition:enter="transition ease-out duration-200"
                    x-transition:enter-start="opacity-0 scale-75 rotate-12"
                    x-transition:enter-end="opacity-100 scale-100 rotate-0"
                    x-transition:leave="transition ease-in duration-150"
                    x-transition:leave-start="opacity-100 scale-100 rotate-0"
                    x-transition:leave-end="opacity-0 scale-75 -rotate-12"
                ></i>
                <i
                    data-lucide="eye-off"
                    class="icon-inline icon-sm"
                    x-show="showPassword"
                    x-transition:enter="transition ease-out duration-200"
                    x-transition:enter-start="opacity-0 scale-75 -rotate-12"
                    x-transition:enter-end="opacity-100 scale-100 rotate-0"
                    x-transition:leave="transition ease-in duration-150"
                    x-transition:leave-start="opacity-100 scale-100 rotate-0"
                    x-transition:leave-end="opacity-0 scale-75 rotate-12"
                ></i>
            </span>
        </button>
    </div>
    {% include "authentication/partials/field_errors.html" with field=field %}
</div>
