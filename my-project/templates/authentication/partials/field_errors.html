{% if form.non_field_errors %}
    <div class="alert alert-error shadow-sm mb-4">
        <ul class="list-disc list-inside text-sm">
            {% for error in form.non_field_errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}

{% if field.errors %}
    <p class="text-error text-sm mt-1">{{ field.errors.0 }}</p>
{% endif %}
