<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Xử lý ảnh OpenCV{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .btn-primary-gradient {
            background: linear-gradient(135deg, #3B82F6 0%, #6366F1 100%);
            border: none;
            color: #FFFFFF;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-[#F9FAFB] text-[#111827]">
    <a href="#auth-content" class="skip-link">Chuyển tới nội dung chính</a>
    {% include "partials/toast_container.html" %}

    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div id="auth-content" class="w-full max-w-md" role="main">
            {% include "partials/messages.html" %}
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="{% static 'js/app.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
